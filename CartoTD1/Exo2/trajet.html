<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leaflet - Géolocalisation</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  body { font-family: sans-serif; margin: 16px; }
  #map { height: 70vh; margin-top: 10px; }
  #info { background: #eee; padding: 10px; }
</style>
</head>
<body>

<h1>Exercice 2 - Leaflet</h1>
<p id="info">Recherche de la position...</p>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>

var NICE      = [43.7009, 7.2683];
var MARSEILLE = [43.2965, 5.3698];

var map = L.map('map').setView(NICE, 12);

//OpenStreetMap + Stamen
var cle = 'eed6a6b4-d171-43e4-8215-e5f8490b4245';

var osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap'
}).addTo(map);

var toner = L.tileLayer('https://tiles.stadiamaps.com/tiles/stamen_toner/{z}/{x}/{y}.png?api_key=' + cle, {
  attribution: '&copy; Stadia Maps, Stamen Design, OpenStreetMap'
});

var watercolor = L.tileLayer('https://tiles.stadiamaps.com/tiles/stamen_watercolor/{z}/{x}/{y}.jpg?api_key=' + cle, {
  attribution: '&copy; Stadia Maps, Stamen Design, OpenStreetMap'
});

L.control.layers({
  'OpenStreetMap': osm,
  'Stamen Toner': toner,
  'Stamen Watercolor': watercolor
}).addTo(map);

//Marqueurs Nice et Marseille
L.marker(NICE).addTo(map).bindPopup('Nice centre-ville');
L.marker(MARSEILLE).addTo(map).bindPopup('Marseille');

//Segment Nice et Marseille
L.polyline([NICE, MARSEILLE], { color: 'blue' }).addTo(map);

//Triangle des Bermudes
L.polygon([
  [25.774, -80.190],  //Miami
  [32.321, -64.757],  //Bermudes
  [18.466, -66.118]   //San Juan
], { color: 'red' }).addTo(map).bindPopup('Triangle des Bermudes');

function distanceGrandCercle(lat1, lon1, lat2, lon2) {
  var R = 6371;
  var rad = Math.PI / 180;
  var dLat = (lat2 - lat1) * rad;
  var dLon = (lon2 - lon1) * rad;
  var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
          Math.cos(lat1 * rad) * Math.cos(lat2 * rad) *
          Math.sin(dLon / 2) * Math.sin(dLon / 2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

//Ma position(Exo 1)
navigator.geolocation.getCurrentPosition(function (position) {
  var lat = position.coords.latitude;
  var lon = position.coords.longitude;
  var precision = position.coords.accuracy;

  var distance = distanceGrandCercle(lat, lon, MARSEILLE[0], MARSEILLE[1]);

  //Marqueur + cercle de rayon
  L.marker([lat, lon]).addTo(map)
    .bindPopup('Ma position<br>Distance Marseille : ' + distance.toFixed(2) + ' km')
    .openPopup();

  L.circle([lat, lon], { radius: precision }).addTo(map);

  document.getElementById('info').textContent =
    'Position : ' + lat.toFixed(5) + ', ' + lon.toFixed(5) +
    ' - Précision : ' + precision.toFixed(0) + ' m' +
    ' - Distance Marseille : ' + distance.toFixed(2) + ' km';

  map.setView([lat, lon], 13);

}, function (err) {
  document.getElementById('info').textContent = 'Erreur ' + err.code + ' : ' + err.message;
}, { enableHighAccuracy: true });

//Données GeoJSON
var xhr = new XMLHttpRequest();
xhr.open('GET', 'https://geo.api.gouv.fr/communes?codePostal=06000&fields=nom,population&format=geojson&geometry=contour');
xhr.responseType = 'json';
xhr.onload = function () {
  if (xhr.status !== 200) return;
  L.geoJSON(xhr.response, {
    color: 'green',
    onEachFeature: function (feature, layer) {
      layer.bindPopup(feature.properties.nom + ' - ' + feature.properties.population + ' habitants');
    }
  }).addTo(map);
};
xhr.send();

//Trajet routier Marseille et Nice
var depart  = MARSEILLE[1] + ',' + MARSEILLE[0];
var arrivee = NICE[1] + ',' + NICE[0];

var xhr2 = new XMLHttpRequest();
xhr2.open('GET', 'https://router.project-osrm.org/route/v1/driving/' + depart + ';' + arrivee + '?overview=full&geometries=geojson');
xhr2.responseType = 'json';
xhr2.onload = function () {
  if (xhr2.status !== 200) return;
  var route = xhr2.response.routes[0];
  L.geoJSON(route.geometry, { color: 'orange' }).addTo(map)
    .bindPopup('Route : ' + (route.distance / 1000).toFixed(1) + ' km');
};
xhr2.send();

</script>
</body>
</html>
